[project]
name = "support-agent"
version = "0.1.0"
description = "First-level support system with OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "openai",
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]